name: Contract CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  contract-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Node.js for Hardhat
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install deps
        run: npm install

      # 🟦 Hardhat compile
      - name: Hardhat compile
        run: npx hardhat compile --force

      # 🟥 TS type check
      - name: TypeScript type check
        run: npm run type-check --if-present

      # 🟧 Run Hardhat Tests (Both Solidity and TS)
      - name: Run Hardhat TS tests
        run: npx hardhat test